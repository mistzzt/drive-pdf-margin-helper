[project]
name = "scribe-crop"
version = "0.1.0"
description = "Auto-crop PDF margins from a OneDrive folder for reading on a Kindle Scribe"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # pdfcropmargins is imported at runtime by the crop shim (scribe_crop.crop_shim),
    # not just shelled out to. It pulls in PyMuPDF, which the shim reaches only
    # through the page objects pdfcropmargins hands it (no direct import of our own).
    "pdfcropmargins>=2.2.1",
    "watchdog>=6.0.0",
]

[project.scripts]
scribe-crop = "scribe_crop.cli:main"
scribe-crop-shim = "scribe_crop.crop_shim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribe_crop"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
